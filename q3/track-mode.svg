    <text id="Motor State" x="1040" y="392" fill="#FF5B4F" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1.6">OVER LIMIT</text>
    </g>
    <g id="Battery">
    <text id="Battery Label" x="1040" y="470" fill="#E4DFD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1.6">BATTERY</text>
    <text id="Battery Value" x="1336" y="560" text-anchor="end" fill="#F3F0E8" font-family="Menlo, ui-monospace, monospace" font-size="96" font-weight="700">72</text>
    <text id="Battery Unit" x="1356" y="560" fill="#C9C4B8" font-family="Menlo, ui-monospace, monospace" font-size="30" font-weight="700">%</text>
    </g>
    <g id="Speed History">
    <rect id="Chart Rule" x="48" y="644" width="1344" height="1" fill="#2E3236"/>
    <text id="Chart Title" x="48" y="678" fill="#E4DFD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.4">SPEED HISTORY</text>
    <text id="Chart Meta" x="1392" y="678" text-anchor="end" fill="#C9C4B8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">km/h &#183; LAST 20 s</text>
