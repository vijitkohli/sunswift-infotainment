    </g>
    <g id="Motor Temperature">
    <text id="Motor Label" x="1040" y="238" fill="#E4DFD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1.6">MOTOR TEMP</text>
    <text id="Motor Value" x="1336" y="336" text-anchor="end" fill="#FF5B4F" font-family="Menlo, ui-monospace, monospace" font-size="112" font-weight="700">91</text>
    <text id="Motor Unit" x="1356" y="336" fill="#C9C4B8" font-family="Menlo, ui-monospace, monospace" font-size="30" font-weight="700">&#176;C</text>
