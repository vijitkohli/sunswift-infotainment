<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Sunswift Track Mode infotainment screen">
  <title>Sunswift Track Mode</title>
  <desc>Landscape race telemetry screen. Colours sampled from the public sunswift.com site and icon.svg (#0A0C0E, #FFD400); not claimed as official brand tokens. Mock-up values only.</desc>

  <g id="Track Mode">
    <rect id="Background" width="1440" height="900" fill="#0A0C0E"/>

    <g id="Header">
    <rect id="Brand Mark" x="48" y="34" width="6" height="26" fill="#FFD400"/>
    <text id="Wordmark" x="68" y="55" fill="#E4DFD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.2">SUNSWIFT</text>
    <text id="Mode Label" x="222" y="55" fill="#C9C4B8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.2">TRACK MODE</text>
    <text id="GPS Label" x="1180" y="55" text-anchor="end" fill="#E4DFD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.2">GPS</text>
    <text id="GPS Value" x="1230" y="55" text-anchor="end" fill="#C9C4B8" font-family="Menlo, ui-monospace, monospace" font-size="22" font-weight="700">&#8212;</text>
    <text id="GPS State" x="1392" y="55" text-anchor="end" fill="#C9C4B8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">NO SIGNAL</text>
    </g>
    <g id="Warning Banner">
    <rect id="Banner Field" x="48" y="86" width="1344" height="96" fill="#43140F"/>
    <rect id="Banner Accent" x="48" y="86" width="8" height="96" fill="#FF5B4F"/>
    <polygon id="Warning Mark" points="96,106 118,146 74,146" fill="#FF5B4F"/>
    <rect id="Mark Stem" x="94" y="118" width="4.5" height="15" fill="#43140F"/>
    <rect id="Mark Dot" x="94" y="137" width="4.5" height="4.5" fill="#43140F"/>
    <text id="Banner Message" x="140" y="145" fill="#F3F0E8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="1">MOTOR TEMPERATURE HIGH</text>
    <text id="Banner Reading" x="1360" y="145" text-anchor="end" fill="#F3F0E8" font-family="Menlo, ui-monospace, monospace" font-size="26" font-weight="700">91 &#176;C &#183; LIMIT 90</text>
    </g>
    <g id="Speed">
    <text id="Speed Label" x="48" y="238" fill="#E4DFD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1.6">SPEED</text>
    <text id="Speed Value" x="480" y="452" text-anchor="end" fill="#F3F0E8" font-family="Menlo, ui-monospace, monospace" font-size="240" font-weight="700">84</text>
    <text id="Speed Unit" x="512" y="452" fill="#C9C4B8" font-family="Menlo, ui-monospace, monospace" font-size="36" font-weight="700">km/h</text>
    <rect id="Speed State Rule" x="48" y="482" width="26" height="6" fill="#E39B12"/>
    <rect x="92" y="482" width="26" height="6" fill="#E39B12"/>
    <rect x="136" y="482" width="26" height="6" fill="#E39B12"/>
